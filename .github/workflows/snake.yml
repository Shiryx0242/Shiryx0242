name: generate animation

on:
  # รันอัตโนมัติทุกๆ เที่ยงคืน
  schedule:
    - cron: "0 0 * * *" 
  
  # อนญาตให้รันเองแบบแมนนวลได้
  workflow_dispatch:
  
  # รันเมื่อมีการอัปเดตไฟล์ใน main branch
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=58a6ff&color_dots=#161b22,#0d2a4c,#154884,#1d67bf,#58a6ff
            
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
